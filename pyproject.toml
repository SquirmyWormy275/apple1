[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "apple1-neural1"
version = "0.2.0"
description = "Virtual-first Apple-1 constrained experimental-computing runtime"
requires-python = ">=3.12"
dependencies = ["py65==1.2.0"]

[project.optional-dependencies]
dev = ["coverage>=7,<8", "hypothesis>=6,<7", "jsonschema>=4,<5", "mypy>=1.15,<2", "pytest>=9,<10", "ruff>=0.12,<1"]

[project.scripts]
neural1 = "neural1.cli:main"
neural1-meta = "neural1.meta_console:main"
neural1-storage = "neural1.storage:main"

[tool.setuptools.packages.find]
include = ["neural1*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["real_model: requires intentionally installed local model runtimes"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["E501", "S101"]

[tool.mypy]
python_version = "3.12"
packages = ["neural1"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["py65.*"]
ignore_missing_imports = true
