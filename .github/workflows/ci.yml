name: validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check neural1 tools/neural1_validate.py tests/test_neural1*.py
      - run: mypy neural1
      - run: python -m pytest -q
      - run: python tools/neural1_validate.py .
      - run: python -m neural1.demos --out out/neural1-demo
