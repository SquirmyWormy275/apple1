name: validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: ruff check --fix --diff neural1 tools/neural1_validate.py tests/test_neural1*.py
      - run: mypy neural1
      - run: python -m pytest -q
      - run: python tools/neural1_validate.py .
      - run: python -m neural1.demos --out out/neural1-demo
      - name: Assert deterministic demo remained off-device
        run: python -c "import json; from pathlib import Path; data=json.loads(Path('out/neural1-demo/summary.json').read_text(encoding='ascii')); assert data['serial_opened'] is False"
      - name: Assert validation did not modify tracked files
        run: git diff --exit-code
