name: one-time merged-branch cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-merged-branches-2026-09-16.yml]
permissions: {}
concurrency:
  group: apple1-one-time-merged-branch-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.repository == 'SquirmyWormy275/apple1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete only exact merged topic tips
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          """One-time, exact-tip cleanup of integrated Apple1 topic branches."""
          import json
          import os
          import re
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          REPO = "SquirmyWormy275/apple1"
          HOUSEKEEPING = "chore/main-cleanup-2026-09-16"
          EXPECTED = {
              "docs/repository-polish-2026-09-16": "0fd59645ddfe883ac6994764cfb52d496764f301",
              "neural1/pi-completion-r3": "fbba2097e3f1f1af858ca3d09b0609b8cb7155b7",
              "commission/neural1-storage-tooling-v1": "2262e9e3bfda99b6b844b95ad9ae6033ea1d48c0",
              "docs/neural1-pi-image-archaeology": "603af1b7e6e6298001374359b44adcf54673e2db",
              "feature/neural1-off-device-completion": "006b9667fb49870a1ec4ef73e1740a862bb2395d",
              "integration/neural1-1976-research": "adca54527c3ed111f026918822e5fcae8db494b9",
              "refactor/repository-architecture-v1": "d6280a3d51e9f1b09eca54582254334d75db3545",
              "research/apple1-display-history": "3c06a857b93409e4c681e1d794fa757bf66db3cc",
              "research/display-history-finalization": "3c06a857b93409e4c681e1d794fa757bf66db3cc",
          }


          def api(method, path):
              request = Request(
                  "https://api.github.com/repos/" + REPO + path,
                  method=method,
                  headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "apple1-one-time-merged-branch-cleanup",
                  },
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      payload = response.read()
                      return json.loads(payload) if payload else None
              except HTTPError as error:
                  if method == "GET" and path.startswith("/git/ref/") and error.code == 404:
                      return None
                  raise RuntimeError(f"GitHub {method} {path}: HTTP {error.code}") from None


          def exact_ref(value, name, sha):
              return (
                  isinstance(value, dict)
                  and value.get("ref") == "refs/heads/" + name
                  and value.get("object", {}).get("type") == "commit"
                  and value.get("object", {}).get("sha") == sha
              )


          def cleanup(call, target, emit):
              if not re.fullmatch(r"[0-9a-f]{40}", target):
                  raise ValueError("invalid target SHA")
              if call("GET", "").get("default_branch") != "main":
                  raise ValueError("default branch changed; no cleanup")
              if not exact_ref(call("GET", "/git/ref/heads/main"), "main", target):
                  raise ValueError("main moved; no cleanup")
              parents = call("GET", "/git/commits/" + target).get("parents", [])
              if len(parents) != 2:
                  raise ValueError("cleanup requires the reviewed two-parent merge")
              expected = {**EXPECTED, HOUSEKEEPING: parents[1]["sha"]}
              active = set()
              for page in range(1, 101):
                  pulls = call("GET", f"/pulls?state=open&per_page=100&page={page}")
                  for pull in pulls:
                      head = pull.get("head", {})
                      if (head.get("repo") or {}).get("full_name") == REPO:
                          active.add(head["ref"])
                  if len(pulls) < 100:
                      break
              else:
                  raise ValueError("open PR inventory incomplete; no cleanup")
              planned = []
              for name, sha in expected.items():
                  value = call("GET", "/git/ref/heads/" + quote(name, safe=""))
                  if not exact_ref(value, name, sha) or name in active:
                      emit({"branch": name, "expected_sha": sha, "result": "kept: missing, moved, or open PR"})
                      continue
                  comparison = call("GET", f"/compare/{sha}...{target}")
                  if comparison.get("merge_base_commit", {}).get("sha") != sha or comparison.get("status") not in {"ahead", "identical"}:
                      emit({"branch": name, "expected_sha": sha, "result": "kept: not an ancestor of main"})
                      continue
                  planned.append((name, sha))
              for name, sha in planned:
                  if not exact_ref(call("GET", "/git/ref/heads/main"), "main", target):
                      raise ValueError("main moved during cleanup; remaining branches retained")
                  encoded = quote(name, safe="")
                  if not exact_ref(call("GET", "/git/ref/heads/" + encoded), name, sha):
                      emit({"branch": name, "expected_sha": sha, "result": "kept: tip changed before deletion"})
                      continue
                  call("DELETE", "/git/refs/heads/" + encoded)
                  emit({"branch": name, "expected_sha": sha, "result": "deleted: exact tip retained in main ancestry"})


          def main():
              if os.environ.get("GITHUB_REPOSITORY") != REPO or os.environ.get("GITHUB_REF") != "refs/heads/main" or os.environ.get("GITHUB_EVENT_NAME") != "push":
                  raise ValueError("cleanup is restricted to this repository's main push")
              def emit(record):
                  print(json.dumps(record, sort_keys=True), flush=True)
                  with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
                      stream.write(f"- `{record['branch']}` at `{record['expected_sha']}`: {record['result']}\n")
              cleanup(api, os.environ["GITHUB_SHA"], emit)


          if __name__ == "__main__":
              main()
          PY
